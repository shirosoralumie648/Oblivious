services:
  postgres:
    image: ${OBLIVIOUS_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: oblivious
      POSTGRES_USER: oblivious
      POSTGRES_PASSWORD: oblivious
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oblivious -d oblivious"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - oblivious-postgres-data:/var/lib/postgresql/data

  redis:
    image: ${OBLIVIOUS_IMAGE_REGISTRY_PREFIX:-}redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - oblivious-redis-data:/data

  oblivious-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GO_IMAGE: ${OBLIVIOUS_IMAGE_REGISTRY_PREFIX:-}golang:1.25-bookworm
        ALPINE_IMAGE: ${OBLIVIOUS_IMAGE_REGISTRY_PREFIX:-}alpine:3.21
        GOPROXY: ${OBLIVIOUS_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${OBLIVIOUS_GOSUMDB:-sum.golang.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - APP_ENV=production
      - DATABASE_URL=postgres://oblivious:oblivious@postgres:5432/oblivious?sslmode=disable
      - SESSION_SECRET=change-me-in-production
      - SESSION_COOKIE_NAME=oblivious_session
      - SESSION_COOKIE_SECURE=false
      - CORS_ALLOWED_ORIGINS=http://localhost:${OBLIVIOUS_WEB_HOST_PORT:-4173},http://localhost:${OBLIVIOUS_SERVER_HOST_PORT:-8080}
      - LLM_BASE_URL=
      - LLM_API_KEY=
      - LLM_TIMEOUT_MS=30000
      - MODEL_DEFAULT_NAME=demo-reply
      - RELAY_ENABLED=true
      - RELAY_DEFAULT_MODEL=gpt-4o-mini
      - OPENAI_API_KEY=
      - OPENAI_BASE_URL=https://api.openai.com
    ports:
      - "${OBLIVIOUS_SERVER_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  oblivious-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_IMAGE: ${OBLIVIOUS_IMAGE_REGISTRY_PREFIX:-}node:20-bookworm-slim
        NGINX_IMAGE: ${OBLIVIOUS_IMAGE_REGISTRY_PREFIX:-}nginx:1.27-alpine
    depends_on:
      oblivious-server:
        condition: service_healthy
    ports:
      - "${OBLIVIOUS_WEB_HOST_PORT:-4173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  oblivious-postgres-data:
  oblivious-redis-data:
