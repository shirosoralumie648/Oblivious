# =============================================================================
# Oblivious - Docker Compose (Development Environment)
# =============================================================================
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f oblivious-server
#   docker compose down -v        # stop and remove volumes
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: ${OBLIVIOUS_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: oblivious-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oblivious}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oblivious}
      POSTGRES_DB: ${POSTGRES_DB:-oblivious}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oblivious}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oblivious-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant (Vector Database)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: oblivious-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClickHouse (Request Log Analytics)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: oblivious-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-oblivious}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: oblivious-clickhouse-init
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./src/server/migrations/clickhouse:/migrations/clickhouse:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for migration in /migrations/clickhouse/*.sql; do
          clickhouse-client --host clickhouse --database "$${CLICKHOUSE_DATABASE:-oblivious}" --multiquery < "$$migration"
        done

  # ---------------------------------------------------------------------------
  # Oblivious Application Server
  # ---------------------------------------------------------------------------
  oblivious-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GOPROXY: ${OBLIVIOUS_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${OBLIVIOUS_GOSUMDB:-sum.golang.org}
    image: ${OBLIVIOUS_SERVER_IMAGE:-oblivious-server:local}
    container_name: oblivious-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    ports:
      - "${OBLIVIOUS_SERVER_HOST_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - APP_ENV=development
      - DATABASE_URL=postgres://oblivious:oblivious@postgres:5432/oblivious?sslmode=disable
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret-change-in-prod}
      - SESSION_COOKIE_NAME=oblivious_session
      - SESSION_COOKIE_SECURE=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RELAY_RATE_LIMIT_BACKEND=${RELAY_RATE_LIMIT_BACKEND:-redis}
      - RELAY_RATE_LIMIT_REDIS_KEY_PREFIX=${RELAY_RATE_LIMIT_REDIS_KEY_PREFIX:-relay:rate_limit}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE:-1536}
      - OBSERVABILITY_REQUEST_LOG_BACKEND=${OBSERVABILITY_REQUEST_LOG_BACKEND:-clickhouse}
      - CLICKHOUSE_DSN=${CLICKHOUSE_DSN:-tcp://clickhouse:9000?database=oblivious}
      - CLICKHOUSE_DRIVER=${CLICKHOUSE_DRIVER:-clickhouse}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT_MS=30000
      - MODEL_DEFAULT_NAME=${MODEL_DEFAULT_NAME:-demo-reply}
      - RELAY_ENABLED=${RELAY_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-debug}

  # ---------------------------------------------------------------------------
  # Oblivious Web
  # ---------------------------------------------------------------------------
  oblivious-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${OBLIVIOUS_WEB_IMAGE:-oblivious-web:local}
    container_name: oblivious-web
    restart: unless-stopped
    depends_on:
      - oblivious-server
    ports:
      - "${OBLIVIOUS_WEB_HOST_PORT:-4173}:80"

  # ---------------------------------------------------------------------------
  # Optional infra extras (enable with: docker compose --profile infra-extras up)
  # Reference shapes for fusion spec part3 §9.1/§9.3; production-grade HA stays
  # a platform responsibility (docs/release/recovery-platform-contract.md).
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: oblivious-pgbouncer
    restart: unless-stopped
    profiles: ["infra-extras"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-oblivious}
      DB_USER: ${POSTGRES_USER:-oblivious}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oblivious}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: oblivious-minio
    restart: unless-stopped
    profiles: ["infra-extras"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oblivious}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oblivious-minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7.1
    container_name: oblivious-kafka
    restart: unless-stopped
    profiles: ["infra-extras"]
    environment:
      KAFKA_KRAFT_CLUSTER_ID: oblivious-kafka-cluster-0001
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  clickhouse_data:
  minio_data:
  kafka_data:
