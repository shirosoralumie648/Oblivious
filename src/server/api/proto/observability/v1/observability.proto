syntax = "proto3";

package observability.v1;

option go_package = "oblivious/server/api/proto/observability/v1";

// ObservabilityService: metrics consumer
service ObservabilityService {
  rpc PublishMetrics(PublishMetricsRequest) returns (PublishMetricsResponse);
  rpc PublishMetricsBatch(stream PublishMetricsRequest) returns (PublishMetricsResponse);
}

message PublishMetricsRequest {
  string service_name = 1;
  string instance_id = 2;
  int64 timestamp = 3;
  repeated Metric metrics = 4;
  map<string, string> labels = 5;
}

message Metric {
  string name = 1;
  MetricType type = 2;
  double value = 3;
  map<string, string> tags = 4;
}

enum MetricType {
  METRIC_TYPE_UNSPECIFIED = 0;
  COUNTER = 1;
  GAUGE = 2;
  HISTOGRAM = 3;
  SUMMARY = 4;
}

message PublishMetricsResponse {
  bool success = 1;
  string message = 2;
  int32 accepted_count = 3;
}
