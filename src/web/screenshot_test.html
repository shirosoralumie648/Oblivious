<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; background: #000; color: #fff; padding: 50px; }
    .dialog {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
    }
    .title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .desc { font-size: 14px; color: #aaa; margin-bottom: 20px; }
    .btns { display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
    .cancel { background: #333; color: #fff; }
    .delete { background: #d32f2f; color: #fff; }
  </style>
</head>
<body>
  <div class="dialog">
    <div class="title">Delete MCP Server</div>
    <div class="desc">Are you sure you want to delete this MCP server? This action cannot be undone.</div>
    <div class="btns">
      <button class="btn cancel">Cancel</button>
      <button class="btn delete">Delete Server</button>
    </div>
  </div>
</body>
</html>
