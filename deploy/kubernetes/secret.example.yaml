apiVersion: v1
kind: Secret
metadata:
  name: oblivious-secrets
  namespace: oblivious
  labels:
    app.kubernetes.io/name: oblivious
type: Opaque
stringData:
  DATABASE_URL: postgres://oblivious:REPLACE_ME@oblivious-postgres.oblivious.svc.cluster.local:5432/oblivious?sslmode=require
  SESSION_SECRET: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  LLM_API_KEY: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME
  QDRANT_API_KEY: ""
  MINIO_ROOT_USER: REPLACE_ME
  MINIO_ROOT_PASSWORD: REPLACE_ME
