apiVersion: v1
kind: Secret
metadata:
  name: oblivious-secret
  namespace: oblivious
  labels:
    app.kubernetes.io/name: oblivious
type: Opaque
stringData:
  DATABASE_URL: postgres://oblivious:REPLACE_ME@postgres:5432/oblivious?sslmode=disable
  SESSION_SECRET: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  LLM_API_KEY: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME
