apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: oblivious
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workflow
  template:
    metadata:
      labels:
        app: workflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: workflow
        image: oblivious/workflow:${OBLIVIOUS_IMAGE_TAG}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8082
        - name: grpc
          containerPort: 50064
        envFrom:
        - configMapRef:
            name: oblivious-config
        - secretRef:
            name: oblivious-secrets
        env:
        - name: WORKFLOW_PORT
          value: "8082"
        - name: PORT
          value: "8082"
        - name: WORKFLOW_GRPC_PORT
          value: "50064"
        - name: GRPC_PORT
          value: "50064"
        - name: OBLIVIOUS_DB_MODE
          value: "microservices"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: DATABASE_URL
        - name: DB_URL_WORKFLOW
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: DB_URL_WORKFLOW
        - name: REDIS_ADDR
          value: "oblivious-redis.oblivious.svc.cluster.local:6379"
        - name: KAFKA_BROKERS
          value: "oblivious-kafka.oblivious.svc.cluster.local:9092"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 12
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-hpa
  namespace: oblivious
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: workflow
  namespace: oblivious
spec:
  selector:
    app: workflow
  ports:
  - name: http
    protocol: TCP
    port: 8082
    targetPort: http
  - name: grpc
    protocol: TCP
    port: 50064
    targetPort: grpc
  type: ClusterIP
