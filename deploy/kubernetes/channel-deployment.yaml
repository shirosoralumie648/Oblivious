apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel
  namespace: oblivious
spec:
  replicas: 2
  selector:
    matchLabels:
      app: channel
  template:
    metadata:
      labels:
        app: channel
    spec:
      containers:
      - name: channel
        image: oblivious/channel:latest
        ports:
        - containerPort: 8080
        env:
        - name: CHANNEL_PORT
          value: "8080"
        - name: OBLIVIOUS_DB_MODE
          value: "microservices"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: channel-hpa
  namespace: oblivious
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channel
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
