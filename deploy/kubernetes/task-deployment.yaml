apiVersion: apps/v1
kind: Deployment
metadata:
  name: task
  namespace: oblivious
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task
  template:
    metadata:
      labels:
        app: task
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: task
        image: oblivious/task:${OBLIVIOUS_IMAGE_TAG}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8084
        - name: grpc
          containerPort: 50065
        envFrom:
        - configMapRef:
            name: oblivious-config
        - secretRef:
            name: oblivious-secrets
        env:
        - name: TASK_PORT
          value: "8084"
        - name: TASK_GRPC_PORT
          value: "50065"
        - name: GRPC_PORT
          value: "50065"
        - name: OBLIVIOUS_DB_MODE
          value: "microservices"
        - name: KAFKA_BROKERS
          value: "oblivious-kafka.oblivious.svc.cluster.local:9092"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 12
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tasks-autoscaler
  namespace: oblivious
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: task
  namespace: oblivious
spec:
  selector:
    app: task
  ports:
  - name: http
    protocol: TCP
    port: 8084
    targetPort: http
  - name: grpc
    protocol: TCP
    port: 50065
    targetPort: grpc
  type: ClusterIP
