apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: oblivious
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: marketplace
        image: oblivious/marketplace:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: oblivious-config
        - secretRef:
            name: oblivious-secrets
        env:
        - name: PORT
          value: "8080"
        - name: OBLIVIOUS_DB_MODE
          value: "microservices"
        - name: DB_URL_MARKETPLACE
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: DB_URL_MARKETPLACE
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketplace-hpa
  namespace: oblivious
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketplace
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
