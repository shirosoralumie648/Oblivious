apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: oblivious
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      containers:
      - name: marketplace
        image: oblivious/marketplace:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: OBLIVIOUS_DB_MODE
          value: "microservices"
        - name: DB_URL_MARKETPLACE
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: db-url-marketplace
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: session-secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketplace-hpa
  namespace: oblivious
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketplace
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
