apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: oblivious
spec:
  replicas: 5
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: relay
        image: oblivious/relay:${OBLIVIOUS_IMAGE_TAG}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: oblivious-config
        - secretRef:
            name: oblivious-secrets
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: APP_ENV
          value: "production"
        - name: OBLIVIOUS_DB_MODE
          value: "microservices"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: DATABASE_URL
        - name: DB_URL_RELAY
          valueFrom:
            secretKeyRef:
              name: oblivious-secrets
              key: DB_URL_RELAY
        - name: RELAY_ENABLED
          value: "true"
        - name: RELAY_DEFAULT_MODEL
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_DEFAULT_MODEL
              optional: true
        - name: RELAY_RATE_LIMIT_BACKEND
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_RATE_LIMIT_BACKEND
              optional: true
        - name: RELAY_SEMANTIC_CACHE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_SEMANTIC_CACHE_BACKEND
              optional: true
        - name: RELAY_BATCH_COMMERCIAL_LIFECYCLE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_BATCH_COMMERCIAL_LIFECYCLE_ENABLED
              optional: true
        - name: RELAY_BATCH_POLLING_WORKER_ENABLED
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_BATCH_POLLING_WORKER_ENABLED
              optional: true
        - name: RELAY_BATCH_POLLING_WORKER_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_BATCH_POLLING_WORKER_INTERVAL_MS
              optional: true
        - name: RELAY_BATCH_POLLING_WORKER_CLAIM_LIMIT
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_BATCH_POLLING_WORKER_CLAIM_LIMIT
              optional: true
        - name: RELAY_REALTIME_COMMERCIAL_LIFECYCLE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: oblivious-config
              key: RELAY_REALTIME_COMMERCIAL_LIFECYCLE_ENABLED
              optional: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          failureThreshold: 12
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relay-hpa
  namespace: oblivious
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relay
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: oblivious
spec:
  selector:
    app: relay
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
