# PgBouncer connection pooler (fusion spec part3 §9.3: 500 max connections).
# Reference manifest: production HA remains a platform responsibility per
# docs/release/recovery-platform-contract.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: oblivious
  labels:
    app.kubernetes.io/name: oblivious
    app.kubernetes.io/component: pgbouncer
data:
  DB_HOST: oblivious-postgres
  DB_PORT: "5432"
  DB_NAME: oblivious
  POOL_MODE: transaction
  MAX_CLIENT_CONN: "500"
  DEFAULT_POOL_SIZE: "20"
  MIN_POOL_SIZE: "0"
  RESERVE_POOL_SIZE: "5"
  AUTH_TYPE: scram-sha-256
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: oblivious
  labels:
    app.kubernetes.io/name: oblivious
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oblivious
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oblivious
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p2
          ports:
            - containerPort: 5432
              name: pgbouncer
          envFrom:
            - configMapRef:
                name: pgbouncer-config
          env:
            - name: DB_USER
              value: oblivious
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oblivious-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: oblivious-pgbouncer
  namespace: oblivious
  labels:
    app.kubernetes.io/name: oblivious
    app.kubernetes.io/component: pgbouncer
spec:
  selector:
    app.kubernetes.io/name: oblivious
    app.kubernetes.io/component: pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
