apiVersion: v1
kind: ConfigMap
metadata:
  name: oblivious-config
  namespace: oblivious
  labels:
    app.kubernetes.io/name: oblivious
data:
  SERVER_PORT: "8080"
  APP_ENV: production
  CORS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:8080
  SESSION_COOKIE_NAME: oblivious_session
  SESSION_COOKIE_SECURE: "false"
  LLM_BASE_URL: ""
  LLM_TIMEOUT_MS: "30000"
  MODEL_DEFAULT_NAME: demo-reply
  RELAY_ENABLED: "true"
  RELAY_DEFAULT_MODEL: gpt-4o-mini
  OPENAI_BASE_URL: https://api.openai.com
