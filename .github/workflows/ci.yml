name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  target-release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install shell gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run target-release-evidence
        run: bash scripts/check.sh target-release-evidence
      - name: Run target-release-evidence verify fixtures
        run: bash scripts/verify-target-release-evidence-fixtures.sh
      - name: Run target-release-evidence assemble fixtures
        run: bash scripts/assemble-target-release-evidence-fixtures.sh

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install shell gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release assets
        run: bash scripts/check.sh docs
      - name: Verify Relay security boundary
        run: bash scripts/check.sh relay-security

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install shell gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify dependency security
        run: bash scripts/check.sh security

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: bash scripts/check.sh web
      - name: Run web tests
        run: bash scripts/test.sh web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --dir src/web exec playwright install --with-deps chromium
      - name: Run Admin and Marketplace E2E
        run: bash scripts/test.sh e2e

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oblivious
          POSTGRES_PASSWORD: oblivious
          POSTGRES_DB: oblivious_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oblivious -d oblivious_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://oblivious:oblivious@127.0.0.1:5432/oblivious_test?sslmode=disable
      OBLIVIOUS_REQUIRE_TEST_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum
      - name: Run server checks
        run: bash scripts/check.sh server
      - name: Run server tests
        run: bash scripts/test.sh server
