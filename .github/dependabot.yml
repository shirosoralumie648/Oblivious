version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /src/server
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
