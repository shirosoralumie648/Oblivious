syntax = "proto3";

package oblivious.relay.v1;

option go_package = "oblivious/api/proto/relay/v1;relayv1";

// RelayService 处理 LLM 代理调用
service RelayService {
  // GenerateReply 同步调用 LLM
  rpc GenerateReply(GenerateReplyRequest) returns (GenerateReplyResponse);

  // GenerateEmbedding 生成文本嵌入
  rpc GenerateEmbedding(GenerateEmbeddingRequest) returns (GenerateEmbeddingResponse);
}

message GenerateReplyRequest {
  string model_id = 1;
  repeated Message messages = 2;
  float temperature = 3;
  int32 max_output_tokens = 4;
  string organization_id = 5;
}

message Message {
  string role = 1;
  string content = 2;
}

message GenerateReplyResponse {
  string content = 1;
  int32 input_tokens = 2;
  int32 output_tokens = 3;
}

message GenerateEmbeddingRequest {
  string model_id = 1;
  string text = 2;
  string organization_id = 3;
}

message GenerateEmbeddingResponse {
  repeated float embedding = 1;
}
