syntax = "proto3";

package oblivious.agent.v1;

option go_package = "oblivious/api/proto/agent/v1;agentv1";

// AgentService 处理 Agent 执行
service AgentService {
  // CreateRun 创建 Agent 运行
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);

  // ExecuteReAct 执行 ReAct 循环
  rpc ExecuteReAct(ExecuteReActRequest) returns (ExecuteReActResponse);

  // ContinueBudget 使用新的 token budget 恢复运行
  rpc ContinueBudget(ContinueBudgetRequest) returns (ContinueBudgetResponse);

  // ApproveToolCall 批准工具调用
  rpc ApproveToolCall(ApproveToolCallRequest) returns (ApproveToolCallResponse);

  // ContinuePlan 继续执行已批准的规划步骤
  rpc ContinuePlan(PlanRunRequest) returns (PlanRunResponse);

  // AdjustPlan 调整剩余规划步骤
  rpc AdjustPlan(AdjustPlanRequest) returns (PlanRunResponse);

  // ApprovePlanStep 批准规划步骤
  rpc ApprovePlanStep(PlanStepActionRequest) returns (PlanStepActionResponse);

  // ExecutePlanStep 执行规划步骤
  rpc ExecutePlanStep(PlanStepActionRequest) returns (PlanStepActionResponse);

  // SkipPlanStep 跳过规划步骤
  rpc SkipPlanStep(PlanStepActionRequest) returns (PlanStepActionResponse);

  // RetryPlanStep 重试失败的规划步骤
  rpc RetryPlanStep(PlanStepActionRequest) returns (PlanStepActionResponse);
}

message CreateRunRequest {
  string agent_id = 1;
  string conversation_id = 2;
  string user_content = 3;
  string organization_id = 4;
  string user_id = 5;
  int32 recursion_depth = 6;
  int32 max_depth = 7;
}

message CreateRunResponse {
  string run_id = 1;
  string status = 2;
}

message ExecuteReActRequest {
  string run_id = 1;
  string organization_id = 2;
  string user_id = 3;
}

message ExecuteReActResponse {
  string run_id = 1;
  string status = 2;
  string result = 3;
  repeated ToolCall pending_tool_calls = 4;
}

message ContinueBudgetRequest {
  string run_id = 1;
  string organization_id = 2;
  string user_id = 3;
  int32 token_budget = 4;
}

message ContinueBudgetResponse {
  string run_id = 1;
  string status = 2;
  string result = 3;
  repeated ToolCall pending_tool_calls = 4;
  repeated PlanStep plan_steps = 5;
}

message ApproveToolCallRequest {
  string run_id = 1;
  string tool_call_id = 2;
  bool approved = 3;
  string organization_id = 4;
  string user_id = 5;
  string reason = 6;
}

message ApproveToolCallResponse {
  string run_id = 1;
  string tool_call_id = 2;
  string status = 3;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input = 3;
  string status = 4;
}

message PlanRunRequest {
  string run_id = 1;
  string organization_id = 2;
  string user_id = 3;
}

message AdjustPlanRequest {
  string run_id = 1;
  string organization_id = 2;
  string user_id = 3;
  string reason = 4;
}

message PlanRunResponse {
  string run_id = 1;
  string status = 2;
  string result = 3;
  repeated PlanStep plan_steps = 4;
}

message PlanStepActionRequest {
  string run_id = 1;
  string plan_step_id = 2;
  string organization_id = 3;
  string user_id = 4;
  string reason = 5;
}

message PlanStepActionResponse {
  string run_id = 1;
  string plan_step_id = 2;
  int32 index = 3;
  string status = 4;
  string approval_status = 5;
  string result = 6;
  string error = 7;
  PlanRunResponse run_detail = 8;
}

message PlanStep {
  string id = 1;
  string run_id = 2;
  int32 index = 3;
  string title = 4;
  string description = 5;
  string status = 6;
  string approval_status = 7;
  string tool_name = 8;
  string input = 9;
  repeated int32 depends_on = 10;
  string result = 11;
  string error = 12;
}
