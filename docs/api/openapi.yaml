  /api/v1/app/quota/topup:
    post:
      summary: 旧版配额充值入口
      operationId: topupQuota
      tags: [Billing]
      description: |
        This compatibility endpoint validates the amount and returns
        `payment_required`; production top-up checkout should use
        `/api/v1/billing/checkout` with `kind=topup`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaTopupRequest"
      responses:
        "402":
          description: 必须通过 billing checkout 完成充值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                ok: false
                data: null
                error:
                  code: payment_required
                  message: "use /api/v1/billing/checkout with kind=topup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

