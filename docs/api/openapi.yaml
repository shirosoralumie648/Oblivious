openapi: "3.0.3"
info:
  title: Oblivious API
  description: |
    Oblivious 是一个面向工作区的 AI 应用平台，提供对话、知识库、任务编排等能力。
    本文档描述了所有可用的 REST API 端点。
  version: "1.0.0"
  contact:
    name: Oblivious Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: https://api.oblivious.dev
    description: 生产环境

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: 登录后通过 Set-Cookie 设置的会话令牌

  schemas:
    Envelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: 成功时返回的业务数据
        error:
          $ref: "#/components/schemas/ErrorPayload"

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: "invalid json body"

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 1

    SessionResponse:
      type: object
      properties:
        onboardingCompleted:
          type: boolean
        preferences:
          $ref: "#/components/schemas/Preferences"
        session:
          type: object
          properties:
            expiresAt:
              type: string
              format: date-time
            id:
              type: string
        user:
          type: object
          properties:
            email:
              type: string
            id:
              type: string
        workspace:
          type: object
          properties:
            id:
              type: string

    Preferences:
      type: object
      properties:
        defaultMode:
          type: string
        modelStrategy:
          type: string
        networkEnabledHint:
          type: boolean
        onboardingCompleted:
          type: boolean

    UpdatePreferencesRequest:
      type: object
      properties:
        defaultMode:
          type: string
        modelStrategy:
          type: string
        networkEnabledHint:
          type: boolean
        onboardingCompleted:
          type: boolean

    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          example: "新对话"

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: "你好"
        overrides:
          $ref: "#/components/schemas/MessageOverrides"

    MessageOverrides:
      type: object
      properties:
        modelId:
          type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean

    UpdateConversationConfigRequest:
      type: object
      properties:
        modelId:
          type: string
        knowledgeBaseIds:
          type: array
          items:
            type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean

    Message:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        documentCount:
          type: integer

    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "产品文档"

    Document:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string

    KnowledgeChunkMetadata:
      type: object
      properties:
        documentVersion:
          type: string
        pageNumber:
          type: integer
        sourceUrl:
          type: string
        startRune:
          type: integer
        endRune:
          type: integer

    KnowledgeDocumentChunk:
      type: object
      properties:
        chunkId:
          type: string
        chunkIndex:
          type: integer
        content:
          type: string
        documentVersion:
          type: string
        charCount:
          type: integer
        estimatedTokenCount:
          type: integer
        metadata:
          $ref: "#/components/schemas/KnowledgeChunkMetadata"

    KnowledgeDocumentVersion:
      type: object
      properties:
        documentId:
          type: string
        knowledgeBaseId:
          type: string
        documentVersion:
          type: string
        title:
          type: string
        content:
          type: string
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]
        chunkCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string

    UpdateKnowledgeDocumentChunkRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    SplitKnowledgeDocumentChunkRequest:
      type: object
      required: [splitAt]
      properties:
        splitAt:
          type: integer
          minimum: 1

    MergeKnowledgeDocumentChunksRequest:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [previous, next]

    RetrieveKnowledgeRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          example: "如何配置模型"
        mode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        limit:
          type: integer
        minScore:
          type: number
          format: double
        documentVersion:
          type: string
        allVersions:
          type: boolean
        vectorWeight:
          type: number
          format: double
        keywordWeight:
          type: number
          format: double

    KnowledgeRetrievalTestRunRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        benchmarkModes:
          type: array
          items:
            type: string
            enum: [vector_only, hybrid, hybrid_rerank]
        limit:
          type: integer
        minScore:
          type: number
          format: double
        documentVersion:
          type: string
        allVersions:
          type: boolean
        vectorWeight:
          type: number
          format: double
        keywordWeight:
          type: number
          format: double

    KnowledgeRetrievalTestRunReport:
      type: object
      properties:
        knowledgeBaseId:
          type: string
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        benchmarks:
          type: array
          items:
            type: object
            properties:
              mode:
                type: string
                enum: [vector_only, hybrid, hybrid_rerank]
              total:
                type: integer
              passed:
                type: integer
              failed:
                type: integer
              passRate:
                type: number
                format: double
              averageRank:
                type: number
                format: double
              results:
                type: array
                items:
                  type: object

    CreateTaskRequest:
      type: object
      required: [goal]
      properties:
        title:
          type: string
        goal:
          type: string
          example: "分析最近一个月的销售数据"
        executionMode:
          type: string
          enum: [auto, semi-auto, manual]
        authorizationScope:
          type: string
        budgetLimit:
          type: integer
        knowledgeBaseIds:
          type: array
          items:
            type: string
        toolAllowList:
          type: array
          items:
            type: string
        toolDenyList:
          type: array
          items:
            type: string

    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [draft, running, paused, completed, cancelled, failed]
        budgetLimit:
          type: integer

    UpdateTaskBudgetRequest:
      type: object
      properties:
        budgetLimit:
          type: integer

    AgentMemory:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        agentId:
          type: string
        type:
          type: string
          enum: [short_term, long_term, user_managed]
        content:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
        metadata:
          type: object
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentMemoryRequest:
      type: object
      required: [content]
      properties:
        agentId:
          type: string
        agent_id:
          type: string
        type:
          type: string
          enum: [short_term, long_term, user_managed]
        content:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
        metadata:
          type: object
          additionalProperties: true

    AgentMemoryImportRequest:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentMemoryRequest"

    AgentMemoryListResponse:
      type: object
      properties:
        memories:
          type: array
          items:
              $ref: "#/components/schemas/AgentMemory"
        total:
          type: integer

    AgentRunCreateRequest:
      type: object
      required: [agent_id, conversation_id, input]
      properties:
        agent_id:
          type: string
        agentId:
          type: string
        conversation_id:
          type: string
        conversationId:
          type: string
        input:
          type: string
        message:
          type: string
        mode:
          type: string
          enum: [react, planning]
        max_iterations:
          type: integer
          minimum: 1
          maximum: 100
        maxIterations:
          type: integer
          minimum: 1
          maximum: 100
        token_budget:
          type: integer
          minimum: 1000
          maximum: 1000000
        tokenBudget:
          type: integer
          minimum: 1000
          maximum: 1000000

    AgentWorkspaceTool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [builtin, mcp, custom]
        serverId:
          type: string
        enabled:
          type: boolean
        requiresApproval:
          type: boolean
        riskLevel:
          type: string
          enum: [safe, medium, dangerous]
        inputSchema:
          type: object
          additionalProperties: true
        runtime:
          type: string
        sourceCode:
          type: string
        timeoutSeconds:
          type: integer

    AgentToolApprovalOverride:
      type: object
      properties:
        requiresApproval:
          type: boolean
        riskLevel:
          type: string
          enum: [safe, medium, dangerous]

    AgentConfig:
      type: object
      properties:
        enableMemory:
          type: boolean
        maxTokens:
          type: integer
        maxIterations:
          type: integer
        tokenBudget:
          type: integer
        defaultExecutionMode:
          type: string
          enum: [react, planning]
        temperature:
          type: number
          format: double
        topP:
          type: number
          format: double
        knowledgeBaseIds:
          type: array
          items:
            type: string
        approvalMode:
          type: string
          enum: [tiered, all, none, custom]
        toolApprovalOverrides:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AgentToolApprovalOverride"

    AgentWorkspaceAgent:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        name:
          type: string
        description:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentWorkspaceTool"
        config:
          $ref: "#/components/schemas/AgentConfig"
        isPublic:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentWorkspaceTool"
        config:
          $ref: "#/components/schemas/AgentConfig"
        isPublic:
          type: boolean

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentWorkspaceTool"
        config:
          $ref: "#/components/schemas/AgentConfig"
        isPublic:
          type: boolean

    AgentRun:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        agentId:
          type: string
        mode:
          type: string
          enum: [react, planning]
        status:
          type: string
          enum: [running, pending_approval, completed, failed, max_iterations_reached, token_budget_exceeded]
        memoryEnabled:
          type: boolean
        memorySearched:
          type: boolean
        memoryResultCount:
          type: integer
        iterationCount:
          type: integer
        toolCallCount:
          type: integer
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentToolDefinition:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
        toolType:
          type: string
          enum: [builtin, mcp, custom]
        requiresApproval:
          type: boolean
        riskLevel:
          type: string
          enum: [safe, medium, dangerous]

    AgentToolRun:
      type: object
      properties:
        id:
          type: string
        runId:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        toolType:
          type: string
        riskLevel:
          type: string
        arguments:
          type: object
          additionalProperties: true
        status:
          type: string
        approvalStatus:
          type: string
        approvalDecisionReason:
          type: string
        attemptCount:
          type: integer
        resultContent:
          type: string
        error:
          type: string

    AgentPlanStep:
      type: object
      properties:
        id:
          type: string
        runId:
          type: string
        index:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [pending, approved, running, completed, failed, skipped]
        approvalStatus:
          type: string
        toolName:
          type: string
        input:
          type: object
          additionalProperties: true
        resultContent:
          type: string
        error:
          type: string

    AgentRunResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        run:
          $ref: "#/components/schemas/AgentRun"
        toolRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolRun"
        planSteps:
          type: array
          items:
            $ref: "#/components/schemas/AgentPlanStep"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    AgentToolDecisionRequest:
      type: object
      properties:
        toolRunId:
          type: string
        tool_run_id:
          type: string
        reason:
          type: string

    AgentPlanStepDecisionRequest:
      type: object
      properties:
        planStepId:
          type: string
        plan_step_id:
          type: string
        reason:
          type: string

    ChannelConfig:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        type:
          type: string
          enum: [api, webhook, feishu, wechat, discord, slack, telegram, web_embed]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Sensitive values such as secret, token, API key, and password fields are redacted as ******** in responses.
        status:
          type: string
          enum: [active, degraded, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChannelConfigRequest:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [api, webhook, feishu, wechat, discord, slack, telegram, web_embed]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, degraded, disabled]

    ChannelStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, degraded, disabled]

    ChannelMessage:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        text:
          type: string
        content:
          type: array
          items:
            type: object
        metadata:
          type: object
          additionalProperties: true

    SendChannelMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/ChannelMessage"

    RetryFailedChannelMessagesRequest:
      type: object
      properties:
        fallback_channel_id:
          type: string
        fallbackChannelId:
          type: string
        limit:
          type: integer
        force:
          type: boolean

    ChannelMessageLog:
      type: object
      properties:
        id:
          type: string
        channel_id:
          type: string
        conversation_id:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
        retry_count:
          type: integer
        failure_reason:
          type: string
        raw_message:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    ChannelRetryProcessResult:
      type: object
      properties:
        claimed:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer

    WorkflowDefinition:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
        definition:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowDefinitionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WorkflowDefinition"

    WorkflowDefinitionsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowDefinition"

    CreateWorkflowRequest:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        definition:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true

    UpdateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        definition:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true

    ExecuteWorkflowRequest:
      type: object
      properties:
        executionMode:
          type: string
          enum: [auto]
        execution_mode:
          type: string
          enum: [auto]
        input:
          type: object
          additionalProperties: true

    RollbackWorkflowRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer

    CreateWorkflowBranchRequest:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        experimentKey:
          type: string
        trafficPercent:
          type: integer

    PublishWorkflowBranchRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    WorkflowExecution:
      type: object
      properties:
        id:
          type: string
        workflowId:
          type: string
        organizationId:
          type: string
        status:
          type: string
          enum: [queued, running, paused, partial_success, completed, succeeded, failed, timeout, cancelled, max_iterations]
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
        nodeExecutions:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNodeExecution"
        error:
          type: object
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowExecutionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WorkflowExecution"

    WorkflowExecutionsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowExecution"

    WorkflowNodeExecution:
      type: object
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        input:
          nullable: true
        output:
          nullable: true
        status:
          type: string
        attempt:
          type: integer
        durationMs:
          type: integer
        tokens:
          type: integer
        costUsd:
          type: number
          format: double
        error:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    WorkflowNodeTestRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          type: string
        node_id:
          type: string
        input:
          type: object
          additionalProperties: true

    WorkflowNodeTestResult:
      type: object
      properties:
        workflowId:
          type: string
        nodeId:
          type: string
        status:
          type: string
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        durationMs:
          type: integer
        trace:
          type: array
          items:
            type: object
            additionalProperties: true

    WorkflowNodeTestResultEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WorkflowNodeTestResult"

    WorkflowResourceCheckRequest:
      type: object
      properties:
        totalTokens:
          type: integer
        nodeExecutionCount:
          type: integer
        now:
          type: string
          format: date-time

    WorkflowFailureDecisionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [retry, retry_with_input, edit_input_retry, continue, skip, branch, fail, terminate]
        input:
          type: object
          additionalProperties: true
        nextNodeId:
          type: string
        nodeId:
          type: string

    WorkflowResumeExecutionRequest:
      type: object
      properties:
        nodeId:
          type: string
        input:
          type: object
          additionalProperties: true

    WorkflowDebugVariableSnapshot:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
        nodeOutputs:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true

    WorkflowDebugTraceEntry:
      type: object
      properties:
        nodeId:
          type: string
        nodeType:
          type: string
        status:
          type: string
        attempt:
          type: integer
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationMs:
          type: integer

    WorkflowDebugPerformance:
      type: object
      properties:
        totalDurationMs:
          type: integer
        nodeDurationsMs:
          type: object
          additionalProperties:
            type: integer
        bottleneckNodeId:
          type: string

    WorkflowDebugLogEntry:
      type: object
      properties:
        level:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        nodeId:
          type: string

    WorkflowExecutionDebugSnapshot:
      type: object
      properties:
        executionId:
          type: string
        workflowId:
          type: string
        status:
          type: string
        variableSnapshot:
          $ref: "#/components/schemas/WorkflowDebugVariableSnapshot"
        trace:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowDebugTraceEntry"
        outputs:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        performance:
          $ref: "#/components/schemas/WorkflowDebugPerformance"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowDebugLogEntry"

    WorkflowExecutionDebugSnapshotEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WorkflowExecutionDebugSnapshot"

    WorkflowSemanticMatchRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string

    WorkflowConversationMatchRequest:
      type: object
      required: [conversationId]
      properties:
        conversationId:
          type: string

    WorkflowSemanticTriggerMatch:
      type: object
      properties:
        workflowId:
          type: string
        workflowVersion:
          type: integer
        workflowName:
          type: string
        triggerId:
          type: string
        keyword:
          type: string
        semanticThreshold:
          type: number
          format: double
        score:
          type: number
          format: double
        matchMethod:
          type: string
        triggerDefinition:
          type: object
          additionalProperties: true
        workflowDefinition:
          type: object
          additionalProperties: true

    WorkflowConversationTriggerMatch:
      type: object
      properties:
        workflowId:
          type: string
        workflowVersion:
          type: integer
        workflowName:
          type: string
        triggerId:
          type: string
        conversationId:
          type: string
        triggerDefinition:
          type: object
          additionalProperties: true
        workflowDefinition:
          type: object
          additionalProperties: true

    WorkflowSemanticMatchesEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowSemanticTriggerMatch"

    WorkflowConversationMatchesEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowConversationTriggerMatch"

    UsageSummary:
      type: object
      properties:
        totalTokens:
          type: integer
        totalCost:
          type: number
          format: double

    BillingSummary:
      type: object
      properties:
        period:
          type: string
        requests:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        estimatedCostUsd:
          type: number
          format: double
        balanceUsd:
          type: number
          format: double
        creditLimitUsd:
          type: number
          format: double
        currentSpendUsd:
          type: number
          format: double
        nextInvoice:
          $ref: "#/components/schemas/BillingInvoiceSummary"

    BillingInvoiceSummary:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        amountUsd:
          type: number
          format: double
        dueAt:
          type: string

    BillingCheckoutRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [subscription, topup]
        packageId:
          type: string
          description: Required for subscription checkout.
        amount:
          type: number
          format: double
          description: Required and positive for top-up checkout.
        provider:
          type: string
          enum: [stripe, alipay, wechatpay]

    BillingCheckoutSession:
      type: object
      properties:
        checkoutSessionId:
          type: string
        url:
          type: string
          format: uri

    DomesticPaymentWebhookEvent:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - checkout.paid
            - refund.succeeded
            - refund.created
            - payment.refunded
            - subscription.updated
            - subscription.deleted
            - subscription.cancelled
            - subscription.canceled
        organization_id:
          type: string
        user_id:
          type: string
        payment_intent_id:
          type: string
        marketplace_order_id:
          type: string
        plan_id:
          type: string
        kind:
          type: string
          enum: [subscription, topup, marketplace_install]
        provider_refund_id:
          type: string
        provider_charge_id:
          type: string
        provider_payment_intent_id:
          type: string
        provider_subscription_id:
          type: string
        provider_customer_id:
          type: string
        provider_checkout_session_id:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          type: string
        reason:
          type: string
        cancel_at_period_end:
          type: boolean

    WebhookReceivedResponse:
      type: object
      properties:
        received:
          type: boolean

    QuotaSnapshot:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        balance:
          type: number
          format: double
          description: Available quota balance in USD.
        used:
          type: number
          format: double
          description: Used quota amount in USD.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PackageOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        quotaAmount:
          type: number
          format: double
        tokenQuota:
          type: integer
        price:
          type: number
          format: double
        modelAccess:
          type: array
          items:
            type: string
        agentLimit:
          type: integer
        maxTokensPerRequest:
          type: integer
        durationDays:
          type: integer
        isActive:
          type: boolean
        isPublic:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuotaTopupRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Positive top-up amount in USD.

    RelayAPIToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tokenPrefix:
          type: string
        status:
          type: string
          enum: [active, revoked]
        userGroup:
          type: string
        modelLimitsEnabled:
          type: boolean
        modelLimits:
          type: array
          items:
            type: string
        quotaLimit:
          type: number
          format: double
        usedQuota:
          type: number
          format: double
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    CreateRelayAPITokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        userGroup:
          type: string
        modelLimitsEnabled:
          type: boolean
        modelLimits:
          type: array
          items:
            type: string
        quotaLimit:
          type: number
          format: double
        expiresAt:
          type: string
          format: date-time

    CreatedRelayAPIToken:
      type: object
      properties:
        rawToken:
          type: string
          description: The one-time raw token value. It is never returned by list APIs.
        token:
          $ref: "#/components/schemas/RelayAPIToken"

    RelayAPITokenUsageItem:
      type: object
      properties:
        id:
          type: string
        apiTokenId:
          type: string
        requestId:
          type: string
        apiType:
          type: string
        model:
          type: string
        channelId:
          type: string
        provider:
          type: string
        status:
          type: string
        statusCode:
          type: integer
        errorCode:
          type: string
        latencyMs:
          type: integer
        cost:
          type: number
          format: double
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        createdAt:
          type: string
          format: date-time

    AccessSummary:
      type: object
      properties:
        features:
          type: object

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

  responses:
    Unauthorized:
      description: 未认证或会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: unauthorized
              message: "authentication required"

    MethodNotAllowed:
      description: 请求方法不被允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: method_not_allowed
              message: "method not allowed"

    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: invalid_request
              message: "invalid json body"

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: not_found
              message: "resource not found"

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: internal_error
              message: "operation failed"

paths:
  # ---- 健康检查 ----
  /healthz:
    get:
      summary: 健康检查
      operationId: healthCheck
      tags: [系统]
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      summary: Prometheus 指标
      operationId: metrics
      tags: [系统]
      security: []
      description: 返回 Prometheus 格式的运行指标，由 promhttp 提供。
      responses:
        "200":
          description: Prometheus 文本格式指标

  # ---- 认证 (Auth) ----
  /api/v1/auth/register:
    post:
      summary: 注册
      operationId: register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: 注册成功，返回会话信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      summary: 登录
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: 登录成功，返回会话信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                ok: false
                data: null
                error:
                  code: invalid_credentials
                  message: "invalid email or password"

  /api/v1/auth/me:
    get:
      summary: 获取当前会话信息
      operationId: getCurrentSession
      tags: [Auth]
      responses:
        "200":
          description: 当前会话详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      summary: 登出
      operationId: logout
      tags: [Auth]
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut:
                            type: boolean
                            example: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- 用户偏好 (Preferences) ----
  /api/v1/app/me/preferences:
    get:
      summary: 获取用户偏好设置
      operationId: getPreferences
      tags: [Preferences]
      responses:
        "200":
          description: 用户偏好
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: 更新用户偏好设置
      operationId: updatePreferences
      tags: [Preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: 更新后的偏好
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- 模型列表 ----
  /api/v1/app/models:
    get:
      summary: 获取可用模型列表
      operationId: listModels
      tags: [Chat]
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- 对话 (Chat) ----
  /api/v1/app/conversations:
    get:
      summary: 获取对话列表
      operationId: listConversations
      tags: [Chat]
      responses:
        "200":
          description: 对话列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 创建新对话
      operationId: createConversation
      tags: [Chat]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "200":
          description: 新创建的对话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/app/conversations/{conversationId}/messages:
    get:
      summary: 获取对话消息列表
      operationId: listMessages
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 发送消息
      operationId: sendMessage
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: 包含用户消息和助手回复的消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/app/conversations/{conversationId}/config:
    get:
      summary: 获取对话配置
      operationId: getConversationConfig
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 对话配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: 更新对话配置
      operationId: updateConversationConfig
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationConfigRequest"
      responses:
        "200":
          description: 更新后的对话配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/app/conversations/{conversationId}/convert-to-task:
    post:
      summary: 将对话转换为任务
      operationId: convertConversationToTask
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 转换后的任务草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- 知识库 (Knowledge) ----
  /api/v1/app/knowledge-bases:
    get:
      summary: 获取知识库列表
      operationId: listKnowledgeBases
      tags: [Knowledge]
      responses:
        "200":
          description: 知识库列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/KnowledgeBase"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 创建知识库
      operationId: createKnowledgeBase
      tags: [Knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "200":
          description: 新创建的知识库
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/app/knowledge-bases/{knowledgeBaseId}:
    get:
      summary: 获取知识库详情
      operationId: getKnowledgeBase
      tags: [Knowledge]
      parameters:
        - name: knowledgeBaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 知识库详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeBase"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: 更新知识库
      operationId: updateKnowledgeBase
      tags: [Knowledge]
      parameters:
        - name: knowledgeBaseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "200":
          description: 更新后的知识库
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: 删除知识库
      operationId: deleteKnowledgeBase
      tags: [Knowledge]
      parameters:
        - name: knowledgeBaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 删除成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/app/knowledge-bases/{knowledgeBaseId}/documents:
    get:
      summary: 获取知识库文档列表
      operationId: listKnowledgeDocuments
      tags: [Knowledge]
      parameters:
        - name: knowledgeBaseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文档列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
