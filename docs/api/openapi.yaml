openapi: "3.0.3"
info:
  title: Oblivious API
  description: |
    Oblivious 是一个面向工作区的 AI 应用平台，提供对话、知识库、任务编排等能力。
    本文档描述了所有可用的 REST API 端点。
  version: "1.0.0"
  contact:
    name: Oblivious Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: https://api.oblivious.dev
    description: 生产环境

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: 登录后通过 Set-Cookie 设置的 HttpOnly、SameSite=Lax 会话令牌
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 对带会话 cookie 的非 GET/HEAD/OPTIONS 变更请求，传入会话响应 data.csrfToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Relay API token
      description: Relay OpenAI-compatible aliases use the raw token returned once by POST /api/v1/console/api-tokens.

  schemas:
    Envelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: 成功时返回的业务数据
        error:
          $ref: "#/components/schemas/ErrorPayload"

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: "invalid json body"

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 1

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    PasswordResetRequestResponse:
      type: object
      required: [requested]
      properties:
        requested:
          type: boolean
        token:
          type: string
          description: Test environment only; production responses omit the raw reset token.

    PasswordResetConfirmResponse:
      type: object
      required: [reset]
      properties:
        reset:
          type: boolean

    AuthLogoutResponse:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          example: true

    SessionResponse:
      type: object
      properties:
        onboardingCompleted:
          type: boolean
        preferences:
          $ref: "#/components/schemas/Preferences"
        csrfToken:
          type: string
          description: 用作后续带会话 cookie 的变更请求 `X-CSRF-Token` header
        session:
          type: object
          properties:
            expiresAt:
              type: string
              format: date-time
            id:
              type: string
        user:
          type: object
          properties:
            email:
              type: string
            id:
              type: string
        workspace:
          type: object
          properties:
            id:
              type: string

    Preferences:
      type: object
      properties:
        defaultMode:
          type: string
        modelStrategy:
          type: string
        networkEnabledHint:
          type: boolean
        onboardingCompleted:
          type: boolean
        defaultAgentModel:
          type: string
        sidebarCollapsed:
          type: boolean
        notifications:
          type: object
          additionalProperties: true

    UpdatePreferencesRequest:
      type: object
      properties:
        defaultMode:
          type: string
        modelStrategy:
          type: string
        networkEnabledHint:
          type: boolean
        onboardingCompleted:
          type: boolean
        defaultAgentModel:
          type: string
        sidebarCollapsed:
          type: boolean
        notifications:
          type: object
          additionalProperties: true

    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          example: "新对话"

    UpdateConversationRequest:
      type: object
      properties:
        title:
          type: string

    ForkConversationRequest:
      type: object
      required: [branchFromMessageId]
      properties:
        branchFromMessageId:
          type: string
        messageId:
          type: string
          deprecated: true
          description: Legacy alias for branchFromMessageId.
        title:
          type: string
        sourceConversationId:
          type: string

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time

    ConversationDeleteResponse:
      type: object
      properties:
        status:
          type: string
          enum: [deleted]

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: "你好"
        overrides:
          $ref: "#/components/schemas/MessageOverrides"

    MessageOverrides:
      type: object
      properties:
        modelId:
          type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean

    UpdateConversationConfigRequest:
      type: object
      properties:
        modelId:
          type: string
        knowledgeBaseIds:
          type: array
          items:
            type: string
        personaId:
          type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean

    ConversationConfig:
      type: object
      properties:
        conversationId:
          type: string
        knowledgeBaseIds:
          type: array
          items:
            type: string
        modelId:
          type: string
        personaId:
          type: string
        personaRole:
          type: string
        personaStyle:
          type: string
        personaTone:
          type: string
        personaConstraints:
          type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    TaskDraft:
      type: object
      properties:
        draftTaskGoal:
          type: string
        relatedKnowledgeBaseIds:
          type: array
          items:
            type: string
        suggestedBudget:
          type: integer
        suggestedExecutionMode:
          type: string

    CreateMessageShareRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time

    CreateConversationShareRequest:
      type: object
      properties:
        startMessageId:
          type: string
        endMessageId:
          type: string
        expiresAt:
          type: string
          format: date-time

    MessageShareResponse:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        messageId:
          type: string
        organizationId:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MessageShareDetailResponse:
      allOf:
        - $ref: "#/components/schemas/MessageShareResponse"
        - type: object
          properties:
            message:
              $ref: "#/components/schemas/Message"

    ConversationShareResponse:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        organizationId:
          type: string
        startMessageId:
          type: string
        endMessageId:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ConversationShareDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ConversationShareResponse"
        - type: object
          properties:
            conversation:
              $ref: "#/components/schemas/Conversation"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"

    Message:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        bookmarked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ChatRealtimeClientMessage:
      type: object
      required: [type, conversationId]
      properties:
        type:
          type: string
          enum: [chat_join, chat_leave, chat_typing]
        conversationId:
          type: string
        isTyping:
          type: boolean

    ChatRealtimeEvent:
      type: object
      required: [type, category, payload, timestamp]
      properties:
        type:
          type: string
          enum: [chat_messages_synced, chat_message_deleted, chat_message_updated, chat_typing]
        category:
          type: string
          enum: [chat]
        payload:
          oneOf:
            - $ref: "#/components/schemas/ChatMessagesSyncedPayload"
            - $ref: "#/components/schemas/ChatMessageUpdatedPayload"
            - $ref: "#/components/schemas/ChatMessageDeletedPayload"
            - $ref: "#/components/schemas/ChatTypingPayload"
        timestamp:
          type: string
          format: date-time

    ChatMessagesSyncedPayload:
      type: object
      required: [conversationId, messages]
      properties:
        conversationId:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        userId:
          type: string

    ChatMessageUpdatedPayload:
      type: object
      required: [conversationId, message, messageId]
      properties:
        conversationId:
          type: string
        message:
          $ref: "#/components/schemas/Message"
        messageId:
          type: string
        userId:
          type: string

    ChatMessageDeletedPayload:
      type: object
      required: [conversationId, messageId]
      properties:
        conversationId:
          type: string
        messageId:
          type: string
        userId:
          type: string

    ChatTypingPayload:
      type: object
      required: [conversationId, isTyping, userId]
      properties:
        conversationId:
          type: string
        isTyping:
          type: boolean
        userId:
          type: string

    UpdateMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    BookmarkMessageRequest:
      type: object
      properties:
        bookmarked:
          type: boolean

    MessageDeleteResponse:
      type: object
      properties:
        status:
          type: string
          enum: [deleted]

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Persona:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        role:
          type: string
        style:
          type: string
        tone:
          type: string
        constraints:
          type: string
        openingMessage:
          type: string
        suggestedQuestions:
          type: array
          items:
            type: string

    PersonaRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
        style:
          type: string
        tone:
          type: string
        constraints:
          type: string
        openingMessage:
          type: string
        suggestedQuestions:
          type: array
          items:
            type: string

    PersonaDeleteResponse:
      type: object
      properties:
        status:
          type: string

    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        documentCount:
          type: integer
        chunkOverlap:
          type: integer
        chunkSize:
          type: integer
        chunkStrategy:
          type: string
        embeddingModel:
          type: string
        keywordWeight:
          type: number
          format: double
        minScore:
          type: number
          format: double
        rerankTopK:
          type: integer
        rerankerModel:
          type: string
        retrievalLimit:
          type: integer
        retrievalMode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]
        updatedAt:
          type: string
          format: date-time
        vectorWeight:
          type: number
          format: double

    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "产品文档"
        chunkOverlap:
          type: integer
        chunkSize:
          type: integer
        chunkStrategy:
          type: string
        embeddingModel:
          type: string
        keywordWeight:
          type: number
          format: double
        minScore:
          type: number
          format: double
        rerankTopK:
          type: integer
        rerankerModel:
          type: string
        retrievalLimit:
          type: integer
        retrievalMode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]
        vectorWeight:
          type: number
          format: double

    Document:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        documentVersion:
          type: string
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]
        updatedAt:
          type: string
          format: date-time

    KnowledgeChunkMetadata:
      type: object
      properties:
        documentVersion:
          type: string
        pageNumber:
          type: integer
        sourceUrl:
          type: string
        startRune:
          type: integer
        endRune:
          type: integer

    KnowledgeDocumentChunk:
      type: object
      properties:
        chunkId:
          type: string
        chunkIndex:
          type: integer
        content:
          type: string
        documentVersion:
          type: string
        charCount:
          type: integer
        estimatedTokenCount:
          type: integer
        metadata:
          $ref: "#/components/schemas/KnowledgeChunkMetadata"

    KnowledgeDocumentVersion:
      type: object
      properties:
        documentId:
          type: string
        knowledgeBaseId:
          type: string
        documentVersion:
          type: string
        title:
          type: string
        content:
          type: string
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]
        chunkCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string
        documentVersion:
          type: string
        pageNumber:
          type: integer
        sourceUrl:
          type: string
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]

    UploadKnowledgeDocumentRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 支持 txt、markdown、pdf、docx 的知识库文档文件。
        title:
          type: string
        documentVersion:
          type: string
        pageNumber:
          type: integer
        sourceUrl:
          type: string
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]

    UpdateKnowledgeDocumentChunkRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    SplitKnowledgeDocumentChunkRequest:
      type: object
      required: [splitAt]
      properties:
        splitAt:
          type: integer
          minimum: 1

    MergeKnowledgeDocumentChunksRequest:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [previous, next]

    RetrieveKnowledgeRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          example: "如何配置模型"
        mode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        limit:
          type: integer
        minScore:
          type: number
          format: double
        documentVersion:
          type: string
        allVersions:
          type: boolean
        vectorWeight:
          type: number
          format: double
        keywordWeight:
          type: number
          format: double

    KnowledgeRetrievalResult:
      type: object
      properties:
        chunkId:
          type: string
        chunkIndex:
          type: integer
        documentId:
          type: string
        documentTitle:
          type: string
        documentVersion:
          type: string
        retrievalMethod:
          type: string
        retrievalMode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        score:
          type: number
          format: double
        similarity:
          type: number
          format: double
        snippet:
          type: string
        source:
          type: object

    CreateKnowledgeRetrievalTestCaseRequest:
      type: object
      required: [query, expectedResult]
      properties:
        query:
          type: string
        expectedResult:
          $ref: "#/components/schemas/KnowledgeRetrievalResult"

    KnowledgeRetrievalTestCase:
      type: object
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        query:
          type: string
        expectedDocumentId:
          type: string
        expectedDocumentTitle:
          type: string
        expectedDocumentVersion:
          type: string
        expectedChunkId:
          type: string
        expectedChunkIndex:
          type: integer
        expectedSnippet:
          type: string
        expectedResult:
          $ref: "#/components/schemas/KnowledgeRetrievalResult"

    KnowledgeRetrievalTestRunRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        benchmarkModes:
          type: array
          items:
            type: string
            enum: [vector_only, hybrid, hybrid_rerank]
        limit:
          type: integer
        minScore:
          type: number
          format: double
        documentVersion:
          type: string
        allVersions:
          type: boolean
        vectorWeight:
          type: number
          format: double
        keywordWeight:
          type: number
          format: double

    KnowledgeRetrievalTestRunReport:
      type: object
      properties:
        knowledgeBaseId:
          type: string
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        benchmarks:
          type: array
          items:
            type: object
            properties:
              mode:
                type: string
                enum: [vector_only, hybrid, hybrid_rerank]
              total:
                type: integer
              passed:
                type: integer
              failed:
                type: integer
              passRate:
                type: number
                format: double
              averageRank:
                type: number
                format: double
              results:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeRetrievalTestRunResult"
        results:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeRetrievalTestRunResult"

    KnowledgeRetrievalTestRunResult:
      type: object
      properties:
        testCaseId:
          type: string
        query:
          type: string
        passed:
          type: boolean
        rank:
          type: integer
        expectedResult:
          $ref: "#/components/schemas/KnowledgeRetrievalResult"
        actualResult:
          $ref: "#/components/schemas/KnowledgeRetrievalResult"
        reason:
          type: string

    CreateTaskRequest:
      type: object
      required: [goal]
      properties:
        title:
          type: string
        goal:
          type: string
          minLength: 1
          pattern: '\S'
          example: "分析最近一个月的销售数据"
        executionMode:
          type: string
          enum: [standard, safe, auto]
        authorizationScope:
          type: string
          enum: [knowledge_only, workspace_tools, full_access]
        budgetLimit:
          type: integer
        knowledgeBaseIds:
          type: array
          items:
            type: string
        toolAllowList:
          type: array
          items:
            type: string
        toolDenyList:
          type: array
          items:
            type: string

    Task:
      type: object
      required: [id, title, goal, status, executionMode, authorizationScope, budgetLimit, budgetConsumed, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [draft, running, paused, awaiting_confirmation, completed, cancelled, failed, stopped]
        executionMode:
          type: string
          enum: [standard, safe, auto]
        authorizationScope:
          type: string
          enum: [knowledge_only, workspace_tools, full_access]
        budgetLimit:
          type: integer
        budgetConsumed:
          type: integer
        resultSummary:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskStep:
      type: object
      required: [id, title, status, stepIndex, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [pending, running, paused, awaiting_confirmation, completed, cancelled, failed]
        stepIndex:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskEvent:
      type: object
      required: [type, message, createdAt]
      properties:
        type:
          type: string
          enum: [started, running, paused, awaiting_confirmation, completed, cancelled, failed]
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    TaskResultArtifact:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [events, knowledgeBaseIds, resultArtifacts, steps, toolAllowList, toolDenyList]
          properties:
            currentStep:
              type: string
            events:
              type: array
              items:
                $ref: "#/components/schemas/TaskEvent"
            knowledgeBaseIds:
              type: array
              items:
                type: string
            resultArtifacts:
              type: array
              items:
                $ref: "#/components/schemas/TaskResultArtifact"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/TaskStep"
            toolAllowList:
              type: array
              items:
                type: string
            toolDenyList:
              type: array
              items:
                type: string

    UpdateTaskBudgetRequest:
      type: object
      properties:
        budgetLimit:
          type: integer

    CreateScheduledTaskRequest:
      type: object
      required: [name, targetType, targetId, cronExpression]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
        targetType:
          type: string
          enum: [workflow, agent]
        targetId:
          type: string
          minLength: 1
          pattern: '\S'
        cronExpression:
          type: string
          description: Standard five-field cron expression or supported descriptor, matching server-side cron validation after trimming whitespace.
          minLength: 1
          pattern: '^\s*(?:(?:\S+\s+){4}\S+|@[A-Za-z]+(?:\s+\S+)?)\s*$'
          example: "0 9 * * *"
        enabled:
          type: boolean

    UpdateScheduledTaskStatusRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    ScheduledTask:
      type: object
      required: [id, organizationId, name, targetType, targetId, cronExpression, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        targetType:
          type: string
          enum: [workflow, agent]
        targetId:
          type: string
        workflowTriggerId:
          type: string
        cronExpression:
          type: string
        enabled:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScheduledTaskRun:
      type: object
      required: [id, organizationId, scheduledTaskId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        scheduledTaskId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
