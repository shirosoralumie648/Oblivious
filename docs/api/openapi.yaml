  /api/v1/workflows/webhooks/{organizationId}/{workflowId}:
    post:
      summary: 接收公开签名工作流 webhook
      operationId: triggerSignedWorkflowWebhook
      tags: [Workflow]
      security: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: X-Oblivious-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix 秒或 RFC3339 时间戳，允许 5 分钟窗口。
        - name: X-Oblivious-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 over `timestamp + "." + raw_body`，可带 `sha256=` 前缀。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: 由 webhook 触发的工作流执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 签名、时间戳或 webhook secret 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: webhook 重放或状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

