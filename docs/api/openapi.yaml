          type: number
          format: double
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    CreateRelayAPITokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        userGroup:
          type: string
        modelLimitsEnabled:
          type: boolean
        modelLimits:
          type: array
          items:
            type: string
        quotaLimit:
          type: number
          format: double
        expiresAt:
          type: string
          format: date-time

    CreatedRelayAPIToken:
      type: object
      properties:
        rawToken:
          type: string
          description: The one-time raw token value. It is never returned by list APIs.
        token:
          $ref: "#/components/schemas/RelayAPIToken"

    RelayAPITokenUsageItem:
      type: object
      properties:
        id:
          type: string
        apiTokenId:
          type: string
        requestId:
          type: string
        apiType:
          type: string
        model:
          type: string
        channelId:
          type: string
        provider:
          type: string
        status:
          type: string
        statusCode:
          type: integer
        errorCode:
          type: string
        latencyMs:
          type: integer
        cost:
          type: number
          format: double
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminObservabilityAlertSeverity:
      type: string
      enum: [debug, info, warning, critical]

    AdminObservabilityAlertStatus:
      type: string
      enum: [open, acknowledged, resolved]

    AdminObservabilityAlertDeliveryChannel:
      type: string
      enum: [email, im, sms, third_party, phone, in_app]

    AdminObservabilityAlertProviderKind:
      type: string
      enum:
        - smtp
        - slack_webhook
        - feishu_webhook
        - dingtalk_webhook
        - wecom_webhook
        - twilio_sms
        - aliyun_sms
        - phone
        - pagerduty
        - opsgenie
        - aliyun_monitor
        - tencent_cloud_monitor

    AdminObservabilityAlertProviderStatus:
      type: string
      enum: [active, disabled]

    AdminObservabilityAlertRoutingRules:
      type: object
      description: Map of alert severity to delivery channels.
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/AdminObservabilityAlertDeliveryChannel"
      example:
        debug: []
        info: [email]
        warning: [email, im]
        critical: [email, im, sms, third_party, phone]

    UpdateAdminObservabilityAlertRoutingRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          $ref: "#/components/schemas/AdminObservabilityAlertRoutingRules"

    AdminObservabilityAlertProviderConfig:
      type: object
      additionalProperties:
        type: string
      description: Provider-specific configuration. Secret values are redacted in responses.

    AdminObservabilityAlertProvider:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderKind"
        channel:
          $ref: "#/components/schemas/AdminObservabilityAlertDeliveryChannel"
        name:
          type: string
        status:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderStatus"
        config:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminObservabilityAlertProviderRequest:
      type: object
      required: [kind, name, status, config]
      properties:
        kind:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderKind"
        name:
          type: string
        status:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderStatus"
        config:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderConfig"

    AdminObservabilityAlertProviderTestResult:
      type: object
      properties:
        providerId:
          type: string
        kind:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderKind"
        channel:
          $ref: "#/components/schemas/AdminObservabilityAlertDeliveryChannel"
        ok:
          type: boolean
        message:
          type: string
        testedAt:
          type: string
          format: date-time

    AdminObservabilityAlertState:
      type: object
      description: Alert state response from the Go observability store.
      properties:
        Key:
          type: string
        Status:
          $ref: "#/components/schemas/AdminObservabilityAlertStatus"
        Severity:
          $ref: "#/components/schemas/AdminObservabilityAlertSeverity"
        OriginalSeverity:
          $ref: "#/components/schemas/AdminObservabilityAlertSeverity"
        Escalated:
          type: boolean
        Title:
          type: string
        Component:
          type: string
        OpenedAt:
          type: string
          format: date-time
        LastOccurredAt:
          type: string
          format: date-time
        OccurrenceCount:
          type: integer
        AcknowledgedAt:
          type: string
          format: date-time
        ResolvedAt:
          type: string
          format: date-time

    AdminObservabilityAlertDeliveryAttempt:
      type: object
      properties:
        id:
          type: string
        alertKey:
          type: string
        severity:
          $ref: "#/components/schemas/AdminObservabilityAlertSeverity"
        component:
          type: string
        channel:
          $ref: "#/components/schemas/AdminObservabilityAlertDeliveryChannel"
        providerId:
          type: string
        providerKind:
          $ref: "#/components/schemas/AdminObservabilityAlertProviderKind"
        delivered:
          type: boolean
        error:
          type: string
        attemptedAt:
          type: string
          format: date-time

    AdminObservabilityRecoveryAction:
      type: object
      description: Recovery action response from the Go observability store.
      properties:
        ID:
          type: string
        PolicyName:
          type: string
        AlertKey:
          type: string
        Severity:
          $ref: "#/components/schemas/AdminObservabilityAlertSeverity"
        Component:
          type: string
        Type:
          type: string
          enum: [restart, scale_out, failover]
        Status:
          type: string
          enum: [recorded, exhausted]
        Reason:
          type: string
        Attempt:
          type: integer
        NextAttemptAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time

    AccessSummary:
      type: object
      properties:
        features:
          type: object

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    RelayOpenAIRequest:
      type: object
      additionalProperties: true
      description: OpenAI-compatible request payload forwarded to the configured relay provider.

    RelayOpenAIResponse:
      type: object
      additionalProperties: true
      description: OpenAI-compatible JSON response returned by the relay provider.

    RelayModelsResponse:
      type: object
      additionalProperties: true
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    RelayErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: true
          properties:
            code:
              type: string
              example: relay_identity_required
            message:
              type: string
              example: relay API token is not authorized for this request

  responses:
    Unauthorized:
      description: 未认证或会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: unauthorized
              message: "authentication required"

    MethodNotAllowed:
      description: 请求方法不被允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: method_not_allowed
              message: "method not allowed"

    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: invalid_request
              message: "invalid json body"

    Forbidden:
      description: 当前用户无权执行该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: forbidden
              message: "admin role required"

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: not_found
              message: "resource not found"

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          example:
            ok: false
            data: null
            error:
              code: internal_error
              message: "operation failed"

paths:
  # ---- 健康检查 ----
  /healthz:
    get:
      summary: 健康检查
      operationId: healthCheck
      tags: [系统]
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      summary: Prometheus 指标
      operationId: metrics
      tags: [系统]
      security: []
      description: 返回 Prometheus 格式的运行指标，由 promhttp 提供。
      responses:
        "200":
          description: Prometheus 文本格式指标

  # ---- 认证 (Auth) ----
  /api/v1/auth/register:
    post:
      summary: 注册
      operationId: register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: 注册成功，返回会话信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      summary: 登录
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: 登录成功，返回会话信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                ok: false
                data: null
                error:
                  code: invalid_credentials
                  message: "invalid email or password"

  /api/v1/auth/me:
    get:
      summary: 获取当前会话信息
      operationId: getCurrentSession
      tags: [Auth]
      responses:
        "200":
          description: 当前会话详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      summary: 登出
      operationId: logout
      tags: [Auth]
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut:
                            type: boolean
                            example: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- 用户偏好 (Preferences) ----
  /api/v1/app/me/preferences:
    get:
      summary: 获取用户偏好设置
      operationId: getPreferences
      tags: [Preferences]
      responses:
        "200":
          description: 用户偏好
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: 更新用户偏好设置
      operationId: updatePreferences
      tags: [Preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: 更新后的偏好
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- 模型列表 ----
  /api/v1/app/models:
    get:
      summary: 获取可用模型列表
      operationId: listModels
      tags: [Chat]
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"

