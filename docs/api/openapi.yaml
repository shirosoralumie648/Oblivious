openapi: "3.0.3"
info:
  title: Oblivious API
  description: |
    Oblivious 是一个面向工作区的 AI 应用平台，提供对话、知识库、任务编排等能力。
    本文档描述了所有可用的 REST API 端点。
  version: "1.0.0"
  contact:
    name: Oblivious Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: https://api.oblivious.dev
    description: 生产环境

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: 登录后通过 Set-Cookie 设置的 HttpOnly、SameSite=Lax 会话令牌
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 对带会话 cookie 的非 GET/HEAD/OPTIONS 变更请求，传入会话响应 data.csrfToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Relay API token
      description: Relay OpenAI-compatible aliases use the raw token returned once by POST /api/v1/console/api-tokens.

  schemas:
    Envelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: 成功时返回的业务数据
        error:
          $ref: "#/components/schemas/ErrorPayload"

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: "invalid json body"

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 1

    SessionResponse:
      type: object
      properties:
        onboardingCompleted:
          type: boolean
        preferences:
          $ref: "#/components/schemas/Preferences"
        csrfToken:
          type: string
          description: 用作后续带会话 cookie 的变更请求 `X-CSRF-Token` header
        session:
          type: object
          properties:
            expiresAt:
              type: string
              format: date-time
            id:
              type: string
        user:
          type: object
          properties:
            email:
              type: string
            id:
              type: string
        workspace:
          type: object
          properties:
            id:
              type: string

    Preferences:
      type: object
      properties:
        defaultMode:
          type: string
        modelStrategy:
          type: string
        networkEnabledHint:
          type: boolean
        onboardingCompleted:
          type: boolean

    UpdatePreferencesRequest:
      type: object
      properties:
        defaultMode:
          type: string
        modelStrategy:
          type: string
        networkEnabledHint:
          type: boolean
        onboardingCompleted:
          type: boolean

    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          example: "新对话"

    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: "你好"
        overrides:
          $ref: "#/components/schemas/MessageOverrides"

    MessageOverrides:
      type: object
      properties:
        modelId:
          type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean

    UpdateConversationConfigRequest:
      type: object
      properties:
        modelId:
          type: string
        knowledgeBaseIds:
          type: array
          items:
            type: string
        systemPromptOverride:
          type: string
        temperature:
          type: number
          format: double
        maxOutputTokens:
          type: integer
        toolsEnabled:
          type: boolean

    Message:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        documentCount:
          type: integer

    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "产品文档"

    Document:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string

    KnowledgeChunkMetadata:
      type: object
      properties:
        documentVersion:
          type: string
        pageNumber:
          type: integer
        sourceUrl:
          type: string
        startRune:
          type: integer
        endRune:
          type: integer

    KnowledgeDocumentChunk:
      type: object
      properties:
        chunkId:
          type: string
        chunkIndex:
          type: integer
        content:
          type: string
        documentVersion:
          type: string
        charCount:
          type: integer
        estimatedTokenCount:
          type: integer
        metadata:
          $ref: "#/components/schemas/KnowledgeChunkMetadata"

    KnowledgeDocumentVersion:
      type: object
      properties:
        documentId:
          type: string
        knowledgeBaseId:
          type: string
        documentVersion:
          type: string
        title:
          type: string
        content:
          type: string
        updateStrategy:
          type: string
          enum: [full_replace, incremental, versioned]
        chunkCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string

    UpdateKnowledgeDocumentChunkRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    SplitKnowledgeDocumentChunkRequest:
      type: object
      required: [splitAt]
      properties:
        splitAt:
          type: integer
          minimum: 1

    MergeKnowledgeDocumentChunksRequest:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [previous, next]

    RetrieveKnowledgeRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          example: "如何配置模型"
        mode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        limit:
          type: integer
        minScore:
          type: number
          format: double
        documentVersion:
          type: string
        allVersions:
          type: boolean
        vectorWeight:
          type: number
          format: double
        keywordWeight:
          type: number
          format: double

    KnowledgeRetrievalTestRunRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [vector_only, hybrid, hybrid_rerank]
        benchmarkModes:
          type: array
          items:
            type: string
            enum: [vector_only, hybrid, hybrid_rerank]
        limit:
          type: integer
        minScore:
          type: number
          format: double
        documentVersion:
          type: string
        allVersions:
          type: boolean
        vectorWeight:
          type: number
          format: double
        keywordWeight:
          type: number
          format: double

    KnowledgeRetrievalTestRunReport:
      type: object
      properties:
        knowledgeBaseId:
          type: string
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        benchmarks:
          type: array
          items:
            type: object
            properties:
              mode:
                type: string
                enum: [vector_only, hybrid, hybrid_rerank]
              total:
                type: integer
              passed:
                type: integer
              failed:
                type: integer
              passRate:
                type: number
                format: double
              averageRank:
                type: number
                format: double
              results:
                type: array
                items:
                  type: object

    CreateTaskRequest:
      type: object
      required: [goal]
      properties:
        title:
          type: string
        goal:
          type: string
          example: "分析最近一个月的销售数据"
        executionMode:
          type: string
          enum: [auto, semi-auto, manual]
        authorizationScope:
          type: string
        budgetLimit:
          type: integer
        knowledgeBaseIds:
          type: array
          items:
            type: string
        toolAllowList:
          type: array
          items:
            type: string
        toolDenyList:
          type: array
          items:
            type: string

    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [draft, running, paused, completed, cancelled, failed]
        budgetLimit:
          type: integer

    UpdateTaskBudgetRequest:
      type: object
      properties:
        budgetLimit:
          type: integer

    AgentMemory:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        agentId:
          type: string
        type:
          type: string
          enum: [short_term, long_term, user_managed]
        content:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
        metadata:
          type: object
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentMemoryRequest:
      type: object
      required: [content]
      properties:
        agentId:
          type: string
        agent_id:
          type: string
        type:
          type: string
          enum: [short_term, long_term, user_managed]
        content:
          type: string
        importance:
          type: integer
          minimum: 1
          maximum: 5
        metadata:
          type: object
          additionalProperties: true

    AgentMemoryImportRequest:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentMemoryRequest"

    AgentMemoryListResponse:
      type: object
      properties:
        memories:
          type: array
          items:
              $ref: "#/components/schemas/AgentMemory"
        total:
          type: integer

    MemoryDocument:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        title:
          type: string
        content:
          type: string
        sourceType:
          type: string
        sourceUrl:
          type: string
        metadata:
          type: object
          additionalProperties: true
        totalChunks:
          type: integer
        embeddingModel:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemoryDocumentRequest:
      type: object
      required: [content]
      properties:
        title:
          type: string
        content:
          type: string
        sourceType:
          type: string
        sourceUrl:
          type: string
        metadata:
          type: object
          additionalProperties: true

    UpdateMemoryDocumentRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string

    MemoryChunk:
      type: object
      properties:
        id:
          type: string
        documentId:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        content:
          type: string
        chunkIndex:
          type: integer
        embedding:
          type: array
          items:
            type: number
            format: float
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    MemorySearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        topK:
          type: integer
          minimum: 1
          maximum: 20
        minScore:
          type: number
          format: double

    MemorySearchResult:
      type: object
      properties:
        documentId:
          type: string
        documentTitle:
          type: string
        chunkContent:
          type: string
        chunkIndex:
          type: integer
        score:
          type: number
          format: double

    AgentRunCreateRequest:
      type: object
      required: [agent_id, conversation_id, input]
      properties:
        agent_id:
          type: string
        agentId:
          type: string
        conversation_id:
          type: string
        conversationId:
          type: string
        input:
          type: string
        message:
          type: string
        mode:
          type: string
          enum: [react, planning]
        max_iterations:
          type: integer
          minimum: 1
          maximum: 100
        maxIterations:
          type: integer
          minimum: 1
          maximum: 100
        token_budget:
          type: integer
          minimum: 1000
          maximum: 1000000
        tokenBudget:
          type: integer
          minimum: 1000
          maximum: 1000000

    AgentWorkspaceTool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [builtin, mcp, custom]
        serverId:
          type: string
        enabled:
          type: boolean
        requiresApproval:
          type: boolean
        riskLevel:
          type: string
          enum: [safe, medium, dangerous]
        inputSchema:
          type: object
          additionalProperties: true
        runtime:
          type: string
        sourceCode:
          type: string
        timeoutSeconds:
          type: integer

    AgentToolApprovalOverride:
      type: object
      properties:
        requiresApproval:
          type: boolean
        riskLevel:
          type: string
          enum: [safe, medium, dangerous]

    AgentConfig:
      type: object
      properties:
        enableMemory:
          type: boolean
        maxTokens:
          type: integer
        maxIterations:
          type: integer
        tokenBudget:
          type: integer
        defaultExecutionMode:
          type: string
          enum: [react, planning]
        temperature:
          type: number
          format: double
        topP:
          type: number
          format: double
        knowledgeBaseIds:
          type: array
          items:
            type: string
        approvalMode:
          type: string
          enum: [tiered, all, none, custom]
        toolApprovalOverrides:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AgentToolApprovalOverride"

    AgentWorkspaceAgent:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        name:
          type: string
        description:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentWorkspaceTool"
        config:
          $ref: "#/components/schemas/AgentConfig"
        isPublic:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentConversation:
      type: object
      properties:
        id:
          type: string
        agentId:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentMessage:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        organizationId:
          type: string
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
        toolCalls:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              arguments:
                type: object
                additionalProperties: true
        toolCallId:
          type: string
        createdAt:
          type: string
          format: date-time

    AgentSendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        mode:
          type: string
          enum: [react, planning]
        max_iterations:
          type: integer
          minimum: 1
        maxIterations:
          type: integer
          minimum: 1
        token_budget:
          type: integer
          minimum: 1000
        tokenBudget:
          type: integer
          minimum: 1000

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentWorkspaceTool"
        config:
          $ref: "#/components/schemas/AgentConfig"
        isPublic:
          type: boolean

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        model:
          type: string
        systemPrompt:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentWorkspaceTool"
        config:
          $ref: "#/components/schemas/AgentConfig"
        isPublic:
          type: boolean

    AgentRun:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        agentId:
          type: string
        mode:
          type: string
          enum: [react, planning]
        status:
          type: string
          enum: [running, pending_approval, completed, failed, max_iterations_reached, token_budget_exceeded]
        memoryEnabled:
          type: boolean
        memorySearched:
          type: boolean
        memoryResultCount:
          type: integer
        iterationCount:
          type: integer
        toolCallCount:
          type: integer
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentToolDefinition:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
        toolType:
          type: string
          enum: [builtin, mcp, custom]
        requiresApproval:
          type: boolean
        riskLevel:
          type: string
          enum: [safe, medium, dangerous]

    AgentToolRun:
      type: object
      properties:
        id:
          type: string
        runId:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        toolType:
          type: string
        riskLevel:
          type: string
        arguments:
          type: object
          additionalProperties: true
        status:
          type: string
        approvalStatus:
          type: string
        approvalDecisionReason:
          type: string
        attemptCount:
          type: integer
        resultContent:
          type: string
        error:
          type: string

    AgentPlanStep:
      type: object
      properties:
        id:
          type: string
        runId:
          type: string
        index:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [pending, approved, running, completed, failed, skipped]
        approvalStatus:
          type: string
        toolName:
          type: string
        input:
          type: object
          additionalProperties: true
        resultContent:
          type: string
        error:
          type: string

    AgentRunResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        run:
          $ref: "#/components/schemas/AgentRun"
        toolRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolRun"
        planSteps:
          type: array
          items:
            $ref: "#/components/schemas/AgentPlanStep"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    AgentRunDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/AgentRun"
        toolRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolRun"
        planSteps:
          type: array
          items:
            $ref: "#/components/schemas/AgentPlanStep"

    AgentToolRunDecisionRequest:
      type: object
      properties:
        reason:
          type: string

    AgentToolDecisionRequest:
      type: object
      properties:
        toolRunId:
          type: string
        tool_run_id:
          type: string
        reason:
          type: string

    AgentPlanStepDecisionRequest:
      type: object
      properties:
        planStepId:
          type: string
        plan_step_id:
          type: string
        reason:
          type: string

    AgentPlanStepUpdateRequest:
      type: object
      properties:
        planStepId:
          type: string
        plan_step_id:
          type: string
        title:
          type: string
        toolName:
          type: string
        tool_name:
          type: string
        input:
          type: object
          additionalProperties: true

    AgentPlanStepCreateRequest:
      type: object
      required: [title]
      properties:
        afterPlanStepId:
          type: string
        after_plan_step_id:
          type: string
        title:
          type: string
        toolName:
          type: string
        tool_name:
          type: string
        input:
          type: object
          additionalProperties: true

    AgentPlanStepMoveRequest:
      type: object
      properties:
        planStepId:
          type: string
        plan_step_id:
          type: string
        direction:
          type: string
          enum: [up, down]

    ChannelConfig:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        type:
          type: string
          enum: [api, webhook, feishu, wechat, discord, slack, telegram, web_embed]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Sensitive values such as secret, token, API key, and password fields are redacted as ******** in responses.
        status:
          type: string
          enum: [active, degraded, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChannelConfigRequest:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [api, webhook, feishu, wechat, discord, slack, telegram, web_embed]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, degraded, disabled]

    ChannelStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, degraded, disabled]

    ChannelMessage:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        text:
          type: string
        content:
          type: array
          items:
            type: object
        metadata:
          type: object
          additionalProperties: true

    SendChannelMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/ChannelMessage"

    RetryFailedChannelMessagesRequest:
      type: object
      properties:
        fallback_channel_id:
          type: string
        fallbackChannelId:
          type: string
        limit:
          type: integer
        force:
          type: boolean

    ChannelMessageLog:
      type: object
      properties:
        id:
          type: string
        channel_id:
          type: string
        conversation_id:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
        retry_count:
          type: integer
        failure_reason:
          type: string
        raw_message:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    ChannelRetryProcessResult:
      type: object
      properties:
        claimed:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer

    WorkflowDefinition:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
        definition:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowDefinitionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
