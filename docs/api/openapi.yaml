paths:
  # ---- 健康检查 ----
  /healthz:
    get:
      summary: 健康检查
      operationId: healthCheck
      tags: [系统]
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      summary: Prometheus 指标
      operationId: metrics
      tags: [系统]
      security: []
      description: 返回 Prometheus 格式的运行指标，由 promhttp 提供。
      responses:
        "200":
          description: Prometheus 文本格式指标

  # ---- 认证 (Auth) ----
  /api/v1/auth/register:
    post:
      summary: 注册
      operationId: register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: 注册成功，返回会话信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      summary: 登录
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: 登录成功，返回会话信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
