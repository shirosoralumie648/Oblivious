        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayOpenAIRequest"
      responses:
        "200":
          description: OpenAI-compatible chat completion response. Streaming requests return provider SSE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayOpenAIResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid relay request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayErrorResponse"
        "401":
