  /api/v1/app/conversations/{conversationId}/messages:
    get:
      summary: 获取对话消息列表
      operationId: listMessages
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 发送消息
      operationId: sendMessage
      tags: [Chat]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
