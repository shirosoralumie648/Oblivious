                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/QuotaSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/app/packages:
    get:
      summary: 获取可购买套餐
      operationId: listPackages
      tags: [Billing]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前可用套餐列表
          content:
